<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#5aa8ee"/>
      <stop offset="1" stop-color="#a996ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fondo: cuadrado redondeado con el degradado de la app -->
  <rect x="0" y="0" width="1024" height="1024" rx="192" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="192" fill="url(#sheen)"/>
  <rect x="20" y="20" width="984" height="984" rx="176" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>

  <!-- mando: cápsula + cruceta + botones -->
  <rect x="152" y="372" width="720" height="280" rx="140" fill="#f4f8ff"/>
  <rect x="317" y="447" width="46" height="130" rx="12" fill="#0a0e1a" fill-opacity="0.82"/>
  <rect x="275" y="489" width="130" height="46" rx="12" fill="#0a0e1a" fill-opacity="0.82"/>
  <circle cx="706" cy="462" r="34" fill="#0a0e1a" fill-opacity="0.82"/>
  <circle cx="770" cy="526" r="34" fill="#0a0e1a" fill-opacity="0.82"/>
</svg>
