name: Publicar instalador

# Compila el instalador de Windows y el APK de Android, y los adjunta a una
# Release cada vez que se empuja un tag "vX.Y.Z". También se puede lanzar a
# mano desde la pestaña Actions (workflow_dispatch), indicando el tag a
# crear.
#
# El APK se compila en el propio runner de GitHub (Java + Android SDK
# instalados ahí), sin ningún servicio externo ni cuenta: `expo prebuild`
# genera el proyecto nativo `android/` y luego se invoca Gradle directamente,
# igual que el instalador de Windows se compila con electron-builder en su
# propio runner. El APK sale firmado con la keystore de debug que genera
# el propio Android Gradle Plugin (es lo que trae el release build type de
# React Native por defecto) — vale para instalarlo en cualquier móvil, no
# para publicarlo en Play Store.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (p. ej. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el instalador
        run: npm run dist -- --publish never

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Backlog ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Sin paso de "preparar Android SDK": los runners ubuntu-latest de
      # GitHub ya traen uno instalado y con las licencias aceptadas (vía
      # ANDROID_HOME/ANDROID_SDK_ROOT). Hasta aquí se usaba
      # android-actions/setup-android@v3 para completarlo, pero una
      # actualización de la imagen del runner le rompió la detección de
      # versión ("Wrong version in preinstalled sdkmanager") y a partir de
      # ahí intenta instalar el paquete "tools", que Google retiró del
      # repositorio — falla siempre, no es cosa nuestra (ver
      # https://github.com/orgs/community/discussions/175460). El SDK
      # preinstalado ya trae de sobra lo que piden expo prebuild y Gradle.

      - name: Instalar dependencias del móvil
        working-directory: mobile
        run: npm ci

      - name: Generar el proyecto nativo de Android
        working-directory: mobile
        env:
          CI: true
        run: npx expo prebuild --platform android --no-install

      - name: Compilar el APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Backlog ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
