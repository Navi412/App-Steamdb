<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Backlog</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles.css">
<script>
  // Aplica el tema guardado antes del primer pintado, para evitar el
  // parpadeo del tema por defecto seguido de un salto al elegido.
  (function () {
    try {
      var theme = localStorage.getItem('sdb-theme');
      if (theme) document.documentElement.dataset.theme = theme;
      var bg = localStorage.getItem('sdb-bg-image');
      if (bg) {
        document.documentElement.style.setProperty('--bg-image', 'url(' + JSON.stringify(bg) + ')');
        document.documentElement.classList.add('has-bg-image');
      }
    } catch {}
  })();
</script>
</head>
<body class="page-list">
  <div id="total-hours-badge" class="total-badge"></div>

  <header class="lib-header">
    <div>
      <p class="lib-kicker">Backlog</p>
      <h1 id="library-title">Biblioteca</h1>
      <p class="lib-status">Servidor: <span id="status">comprobando…</span></p>
    </div>
    <button id="settings-button" type="button" class="theme-button">
      <span class="theme-icon" aria-hidden="true">⚙️</span> Ajustes
    </button>
  </header>

  <!-- Ajustes: plataformas conectadas + tema de la interfaz -->
  <div id="settings-modal" class="modal theme-modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="settings-close" type="button" aria-label="Cerrar">×</button>
      <h2>Ajustes</h2>

      <p class="theme-section-label">Plataformas conectadas</p>
      <ul class="ob-summary-list" id="settings-platform-list"></ul>
      <a class="ob-link-btn" href="/onboarding.html">🔗 Configurar plataformas →</a>

      <p class="theme-section-label" style="margin-top: 1.6rem">Paleta</p>
      <div class="theme-swatches" id="theme-swatches"></div>
      <p class="theme-section-label">Fondo</p>
      <div class="theme-bg-row">
        <label class="file-btn">
          <input type="file" accept="image/*" id="theme-bg-file" hidden>
          Imagen de fondo…
        </label>
        <button type="button" id="theme-bg-remove" hidden>Quitar imagen</button>
        <span class="theme-bg-name" id="theme-bg-name"></span>
      </div>
    </div>
  </div>

  <section>
    <h2>Añadir juego manual</h2>
    <form id="add-game-form" class="inline">
      <input name="title" placeholder="Título" required>
      <select name="platform" id="platform-select" class="filter-select" required>
        <option value="" disabled selected>Plataforma…</option>
        <optgroup label="PC" style="color: var(--accent)">
          <option value="Steam">Steam</option>
          <option value="Epic Games">Epic Games</option>
          <option value="GOG">GOG</option>
          <option value="Battle.net">Battle.net</option>
          <option value="Ubisoft Connect">Ubisoft Connect</option>
          <option value="EA App">EA App</option>
          <option value="Xbox App (PC)">Xbox App (PC)</option>
          <option value="PC (otro)">PC (otro)</option>
        </optgroup>
        <optgroup label="PlayStation" style="color: var(--accent-2)">
          <option value="PS5">PS5</option>
          <option value="PS4">PS4</option>
          <option value="PS3">PS3</option>
          <option value="PS2">PS2</option>
          <option value="PS1">PS1</option>
          <option value="PS Vita">PS Vita</option>
          <option value="PSP">PSP</option>
        </optgroup>
        <optgroup label="Xbox" style="color: var(--ok)">
          <option value="Xbox Series X|S">Xbox Series X|S</option>
          <option value="Xbox One">Xbox One</option>
          <option value="Xbox 360">Xbox 360</option>
          <option value="Xbox">Xbox</option>
        </optgroup>
        <optgroup label="Nintendo" style="color: var(--danger)">
          <option value="Switch 2">Switch 2</option>
          <option value="Switch">Switch</option>
          <option value="Wii U">Wii U</option>
          <option value="Wii">Wii</option>
          <option value="3DS">3DS</option>
          <option value="DS">DS</option>
        </optgroup>
        <optgroup label="Móvil" style="color: var(--gold)">
          <option value="Android">Android</option>
          <option value="iOS">iOS</option>
        </optgroup>
        <optgroup label="Otras" style="color: var(--text-muted)">
          <option value="Mac">Mac</option>
          <option value="Linux">Linux</option>
          <option value="__other__">Otra…</option>
        </optgroup>
      </select>
      <input name="platform-other" id="platform-other" placeholder="Nombre de la plataforma" hidden>
      <label class="file-btn">
        <input type="file" name="cover" accept="image/*" hidden>
        Carátula…
      </label>
      <span class="file-name" id="cover-name"></span>
      <button type="submit">Añadir</button>
    </form>
  </section>

  <section>
    <div class="tabs">
      <div class="tabs-list">
        <button class="tab is-active" data-tab="all" type="button">Mis juegos</button>
        <button class="tab" data-tab="toplay" type="button">
          Lista de siguientes <span class="tab-count" id="toplay-count">0</span>
        </button>
      </div>
      <div class="tabs-actions">
        <button id="roulette-button" type="button" hidden>
          <span class="roulette-icon" aria-hidden="true">◉</span> Ruleta
        </button>
        <button id="sync-button" type="button">Sincronizar</button>
      </div>
    </div>

    <div class="filter-bar">
      <input id="search-input" type="search" placeholder="Buscar un juego..." class="search-box">
      <select id="platform-filter" class="filter-select">
        <option value="">Todas las plataformas</option>
      </select>
      <select id="sort-order" class="filter-select">
        <option value="title">Orden: A–Z</option>
        <option value="most">Orden: más jugadas</option>
        <option value="least">Orden: menos jugadas</option>
      </select>
    </div>
    <ul id="games-list" class="shelf"></ul>
  </section>

  <!-- Zona que aparece a la izquierda mientras arrastras un juego -->
  <div id="drop-next" class="drop-next">
    <div class="drop-next-inner">
      <span class="drop-next-icon">＋</span>
      <span class="drop-next-label">Lista de siguientes</span>
      <span class="drop-next-hint">suelta el juego aquí</span>
    </div>
  </div>

  <!-- Ruleta para elegir el próximo juego -->
  <div id="roulette-modal" class="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="roulette-close" type="button" aria-label="Cerrar">×</button>
      <h2>¿A qué juego jugamos?</h2>
      <div class="wheel-stage">
        <div class="wheel-wrap">
          <div class="wheel-tick" aria-hidden="true"></div>
          <div class="wheel" id="wheel"></div>
          <div class="wheel-center" aria-hidden="true"></div>
          <div class="tonearm" aria-hidden="true">
            <span class="tonearm-tube"></span>
            <span class="tonearm-head"></span>
            <span class="tonearm-weight"></span>
            <span class="tonearm-pivot"></span>
          </div>
        </div>
      </div>
      <p class="wheel-result" id="wheel-result">Gira la ruleta…</p>
      <div class="wheel-actions">
        <button id="wheel-spin" type="button">Girar</button>
        <a id="wheel-go" href="#" hidden>Abrir ficha →</a>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
