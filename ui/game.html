<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SteamDB — detalle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="total-hours-badge" class="total-badge"></div>

  <a class="back-link" href="/" id="back-link">← Biblioteca</a>

  <section class="header-card">
    <div id="game-header" class="game-header"></div>

    <div class="cover-edit">
      <label class="file-btn">
        <input type="file" accept="image/*" id="cover-file" hidden>
        Cambiar carátula
      </label>
      <button type="button" id="cover-remove" hidden>Quitar carátula</button>
      <span id="cover-msg" class="cover-msg" role="status"></span>
    </div>

    <div id="game-stats" class="stats"></div>

    <div class="igdb-block">
      <h2>Tiempo para completarlo</h2>
      <div id="igdb-stats" class="stats"></div>
      <div class="section-header">
        <button id="igdb-search-button" type="button">Buscar en IGDB</button>
      </div>
      <form id="igdb-form" class="inline">
        <input name="mainHours" type="number" min="0" step="0.5" placeholder="Principal (h)">
        <input name="completionistHours" type="number" min="0" step="0.5" placeholder="Completista (h)">
        <button type="submit">Guardar</button>
      </form>
    </div>
  </section>

  <section>
    <h2>Historial de sesiones</h2>
    <form id="log-form" class="inline log-form">
      <input name="hours" type="number" min="0.25" step="0.25" placeholder="Horas jugadas" required>
      <input name="note" type="text" placeholder="Nota (opcional)">
      <button type="submit">Registrar sesión</button>
    </form>
    <ul id="sessions-list"></ul>
  </section>

  <section>
    <h2>Logros</h2>
    <ul id="achievements-list"></ul>
  </section>

  <script src="/common.js"></script>
  <script src="/game.js"></script>
</body>
</html>
