<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Backlog — bienvenida</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles.css">
<script>
  // Aplica estilo, modo y personalización guardados antes del primer
  // pintado (igual que el resto de páginas), para que la bienvenida no
  // desentone si ya se eligió algo.
  (function () {
    try {
      var style = localStorage.getItem('sdb-style');
      if (style) document.documentElement.dataset.style = style;
      document.documentElement.dataset.mode = localStorage.getItem('sdb-mode') || 'dark';
      var bg = localStorage.getItem('sdb-bg-image');
      if (bg) {
        document.documentElement.style.setProperty('--bg-image', 'url(' + JSON.stringify(bg) + ')');
        document.documentElement.classList.add('has-bg-image');
      }
      var customRaw = localStorage.getItem('sdb-custom');
      if (customRaw) {
        var custom = JSON.parse(customRaw);
        var root = document.documentElement.style;
        if (custom.font) root.setProperty('--font', custom.font);
        if (custom.bg) root.setProperty('--bg', custom.bg);
        if (custom.accent) root.setProperty('--accent', custom.accent);
        if (custom.titleFrom && custom.titleTo) {
          root.setProperty('--h1-grad', 'linear-gradient(120deg, ' + custom.titleFrom + ', ' + custom.titleTo + ')');
        }
      }
    } catch {}
  })();
</script>
</head>
<body class="page-onboarding">
  <div class="onboarding-shell">
    <header class="onboarding-head">
      <p class="lib-kicker">BACKLOG</p>
      <div class="onboarding-progress" id="onboarding-progress"></div>
    </header>

    <div class="onboarding-tracker" id="onboarding-tracker"></div>

    <section class="onboarding-card" id="onboarding-card">
      <div class="onboarding-step" id="onboarding-step"></div>
    </section>
  </div>

  <script src="/common.js"></script>
  <script src="/onboarding.js"></script>
</body>
</html>
